<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ames Room &amp; The Ambiguous Retinal Image — PSY2008 L2</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #eee; }
  #canvas-container { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 16px; left: 16px; width: 320px;
    background: rgba(20, 24, 36, 0.92); padding: 18px; border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
    font-size: 14px; line-height: 1.4;
  }
  #panel h1 { font-size: 17px; margin: 0 0 10px; color: #e94560; }
  #panel h2 { font-size: 13px; margin: 16px 0 8px; color: #8aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  #panel label { display: block; margin: 10px 0 4px; color: #ccd; }
  #panel input[type="range"] { width: 100%; accent-color: #e94560; }
  #panel button {
    width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px;
    background: #0f3460; color: #fff; font-size: 14px; cursor: pointer; transition: background 0.15s;
  }
  #panel button:hover { background: #e94560; }
  #panel button.active { background: #e94560; }
  #panel .row { display: flex; gap: 8px; }
  #panel .row button { flex: 1; }
  #panel .value { float: right; color: #e94560; font-weight: 600; }
  #panel .note { color: #9ab; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  #readout {
    position: absolute; bottom: 16px; left: 16px; right: 16px; pointer-events: none;
    display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
  }
  .badge {
    background: rgba(20, 24, 36, 0.9); padding: 10px 18px; border-radius: 10px;
    color: #eee; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .badge b { color: #e94560; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="panel">
  <h1>Perception Demo</h1>

  <div class="row">
    <button id="btn-ames" class="active">Ames Room</button>
    <button id="btn-oneimage">One Image</button>
  </div>

  <h2>Scene controls</h2>
  <div class="row">
    <button id="btn-peephole" class="active">Peephole</button>
    <button id="btn-orbit">Free orbit</button>
  </div>
  <button id="btn-true">Show true shape</button>

  <div id="ames-controls">
    <label>Figure position <span id="pos-val" class="value">Left</span></label>
    <input type="range" id="pos-slider" min="0" max="100" value="0">
  </div>

  <div id="oneimage-controls" style="display:none;">
    <label>Object B distance <span id="dist-val" class="value">6.0 m</span></label>
    <input type="range" id="dist-slider" min="2" max="20" step="0.1" value="6">
    <label>Object B size <span id="size-val" class="value">1.50 m</span></label>
    <input type="range" id="size-slider" min="0.2" max="3" step="0.05" value="1.5">
  </div>

  <button id="btn-reset">Reset</button>

  <p class="note" id="note-text"></p>
</div>

<div id="readout">
  <div class="badge" id="badge1"></div>
  <div class="badge" id="badge2"></div>
  <div class="badge" id="badge3"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ------------------------------------------------------------------
   Shared setup
   ------------------------------------------------------------------ */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11131a);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));

const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
dirLight.position.set(4, 8, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const fillLight = new THREE.PointLight(0xffe0c0, 0.5, 20);
fillLight.position.set(0, 2.5, -4);
scene.add(fillLight);

const deepLight = new THREE.PointLight(0xfff2e0, 0.4, 25);
deepLight.position.set(-1, 2.5, -12);
scene.add(deepLight);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
let controls = null;

// Peephole: camera fully locked (no controls object at all).
// Free orbit: rotate only — no pan, no zoom.
function attachControls(target) {
  detachControls();
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.enableZoom = false;
  controls.minPolarAngle = Math.PI * 0.15;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.target.copy(target);
}
function detachControls() {
  if (controls) { controls.dispose(); controls = null; }
}

/* ------------------------------------------------------------------
   Texture helpers
   ------------------------------------------------------------------ */
function maxAniso() { return renderer.capabilities.getMaxAnisotropy(); }

function checkerTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#161616';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillRect(128, 128, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso();
  return tex;
}

function stripedTexture(color1, color2, vertical) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color1; ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = color2;
  const n = 16, gap = 512 / n;
  for (let i = 0; i < n; i += 2) {
    if (vertical) ctx.fillRect(i * gap, 0, gap, 512);
    else ctx.fillRect(0, i * gap, 512, gap);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso();
  return tex;
}

function makeTextSprite(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 56px Segoe UI, sans-serif';
  ctx.fillStyle = color || '#e94560';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  spr.scale.set(2.4, 0.6, 1);
  return spr;
}

function makeLine(p1, p2, color) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: color }));
}

/* ------------------------------------------------------------------
   Scene 1: Ames Room — ray construction.
   Every actual corner lies on the ray from the peephole through the
   matching corner of an imaginary rectangular room, so from the
   peephole the room projects as a perfect rectangle.
   ------------------------------------------------------------------ */
const amesGroup = new THREE.Group();
scene.add(amesGroup);

const EYE = new THREE.Vector3(0, 1.5, 5.5);   // peephole position
const S_LEFT = 1.6;                            // left corners: farther along the ray
const S_RIGHT = 0.75;                          // right corners: closer along the ray

// Apparent (imaginary) rectangular room: front frame z=0, back wall z=-8
const A = {
  FL:  new THREE.Vector3(-2, 0, 0),  FR:  new THREE.Vector3(2, 0, 0),
  FTL: new THREE.Vector3(-2, 3, 0),  FTR: new THREE.Vector3(2, 3, 0),
  BL:  new THREE.Vector3(-1.6, 0, -8), BR:  new THREE.Vector3(1.6, 0, -8),
  BTL: new THREE.Vector3(-1.6, 3, -8), BTR: new THREE.Vector3(1.6, 3, -8),
};

function alongRay(apparent, s) {
  return EYE.clone().add(apparent.clone().sub(EYE).multiplyScalar(s));
}

// Actual room corners (front frame is shared with the apparent room)
const FL = A.FL, FR = A.FR, FTL = A.FTL, FTR = A.FTR;
const BL = alongRay(A.BL, S_LEFT),  BTL = alongRay(A.BTL, S_LEFT);
const BR = alongRay(A.BR, S_RIGHT), BTR = alongRay(A.BTR, S_RIGHT);

function makeQuad(p1, p2, p3, p4, material, ru, rv) {
  const geo = new THREE.BufferGeometry();
  const verts = new Float32Array([
    p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z,
  ]);
  const uvs = new Float32Array([0, 0,  ru, 0,  ru, rv,  0, rv]);
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex([0, 1, 2, 0, 2, 3]);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.receiveShadow = true;
  return mesh;
}

// Subdivided (non-planar) quad — needed for the creased floor/ceiling.
// uvFn(worldPoint, u, v) returns [uTex, vTex].
function makeSubdivQuad(p1, p2, p3, p4, seg, material, uvFn) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= seg; j++) {
    const v = j / seg;
    const a = new THREE.Vector3().lerpVectors(p1, p4, v);
    const b = new THREE.Vector3().lerpVectors(p2, p3, v);
    for (let i = 0; i <= seg; i++) {
      const u = i / seg;
      const p = new THREE.Vector3().lerpVectors(a, b, u);
      pos.push(p.x, p.y, p.z);
      const t = uvFn(p, u, v);
      uv.push(t[0], t[1]);
    }
  }
  for (let j = 0; j < seg; j++) for (let i = 0; i < seg; i++) {
    const r0 = j * (seg + 1) + i, r1 = r0 + seg + 1;
    idx.push(r0, r0 + 1, r1, r0 + 1, r1 + 1, r1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.receiveShadow = true;
  return mesh;
}

const wallTex = stripedTexture('#ddd7ca', '#c9c2b2', true);
const ceilTex = stripedTexture('#e9e5dd', '#d8d3c7', false);
const matWall = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85, side: THREE.DoubleSide });
const matCeil = new THREE.MeshStandardMaterial({ map: ceilTex, roughness: 0.9, side: THREE.DoubleSide, transparent: true });
const matFloor = new THREE.MeshStandardMaterial({ map: checkerTexture(), roughness: 0.85, side: THREE.DoubleSide });

// Walls and back wall are planar quads; floor and ceiling are creased
// surfaces, so they are built from a fine mesh.
amesGroup.add(makeQuad(BL, BR, BTR, BTL, matWall, 4, 1.6));          // back wall
amesGroup.add(makeQuad(FL, BL, BTL, FTL, matWall, 12, 1.6));         // left wall
amesGroup.add(makeQuad(FR, BR, BTR, FTR, matWall, 6, 1.6));          // right wall
amesGroup.add(makeSubdivQuad(FTL, FTR, BTR, BTL, 24, matCeil, (p, u, v) => [u * 4, v * 8]));

// Floor UVs: project each point from the peephole onto the apparent
// floor plane (y = 0), so the checkerboard looks like a regular grid
// when seen through the peephole — the way a real Ames room is painted.
const TILE = 0.5;
amesGroup.add(makeSubdivQuad(FL, FR, BR, BL, 48, matFloor, (p) => {
  const t = EYE.y / (EYE.y - p.y);
  const q = EYE.clone().lerp(p, t);
  return [(q.x + 2) / TILE, (0 - q.z) / TILE];
}));

// Door frame at the opening (the "window" you look through)
const frameMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 });
function makeBeam(p1, p2, thickness) {
  const len = p1.distanceTo(p2);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(thickness, thickness, len), frameMat);
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  mesh.lookAt(p2);
  return mesh;
}
amesGroup.add(makeBeam(FL, FTL, 0.15), makeBeam(FR, FTR, 0.15),
              makeBeam(FTL, FTR, 0.15), makeBeam(FL, FR, 0.15));

// True-shape overlay (free orbit only)
const trueShapeGroup = new THREE.Group();
[
  [FL, FR], [FR, BR], [BR, BL], [BL, FL],
  [FTL, FTR], [FTR, BTR], [BTR, BTL], [BTL, FTL],
  [FL, FTL], [FR, FTR], [BL, BTL], [BR, BTR],
].forEach(([a, b]) => trueShapeGroup.add(makeLine(a, b, 0xe94560)));
const farLabel = makeTextSprite('far corner', '#4ade80');
farLabel.position.copy(BTL).add(new THREE.Vector3(0, 0.7, 0));
trueShapeGroup.add(farLabel);
const nearLabel = makeTextSprite('near corner', '#4ade80');
nearLabel.position.copy(BTR).add(new THREE.Vector3(0, 0.7, 0));
trueShapeGroup.add(nearLabel);
amesGroup.add(trueShapeGroup);
trueShapeGroup.visible = false;

// Peephole marker (free orbit only): shows where the illusion works from
const peepholeMarker = new THREE.Group();
const eyeBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xe94560, emissive: 0x66111a, emissiveIntensity: 0.5 })
);
eyeBall.position.copy(EYE);
peepholeMarker.add(eyeBall);
peepholeMarker.add(makeLine(EYE, new THREE.Vector3(0, 1.5, -8), 0xe94560));
const eyeLabel = makeTextSprite('peephole', '#e94560');
eyeLabel.position.copy(EYE).add(new THREE.Vector3(0, 0.55, 0));
peepholeMarker.add(eyeLabel);
amesGroup.add(peepholeMarker);
peepholeMarker.visible = false;

// Character — same physical height everywhere in the room
const CHAR_HEIGHT = 1.34;
const charGroup = new THREE.Group();
const charBody = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.22, 1.0, 16),
  new THREE.MeshStandardMaterial({ color: 0xe94560, emissive: 0x66111a, emissiveIntensity: 0.35 })
);
charBody.position.y = 0.5;
charBody.castShadow = true;
const charHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffb6b6, emissive: 0x441111, emissiveIntensity: 0.2 })
);
charHead.position.y = 1.18;
charHead.castShadow = true;
charGroup.add(charBody, charHead);
amesGroup.add(charGroup);

function updateCharacter(t) {
  // t in [0,1]: walk along the back wall from far (left) to near (right)
  const M = 0.12; // keep off the side walls
  const pos = new THREE.Vector3().lerpVectors(BL, BR, M + (1 - 2 * M) * t);
  charGroup.position.copy(pos);

  const dist = EYE.distanceTo(pos);
  const head = pos.clone().setY(pos.y + CHAR_HEIGHT);
  const ang = pos.clone().sub(EYE).angleTo(head.clone().sub(EYE)) * 180 / Math.PI;
  // Where the feet project onto the apparent floor → how far the brain assumes
  const q = EYE.clone().lerp(pos, EYE.y / (EYE.y - pos.y));
  const assumedDist = EYE.distanceTo(q);
  const perceived = CHAR_HEIGHT * assumedDist / dist;

  document.getElementById('badge1').innerHTML = `True distance: <b>${dist.toFixed(1)} m</b>`;
  document.getElementById('badge2').innerHTML = `Angular height: <b>${ang.toFixed(1)}°</b>`;
  document.getElementById('badge3').innerHTML = `If the room were real: <b>≈ ${perceived.toFixed(2)} m tall</b>`;
}

/* ------------------------------------------------------------------
   Scene 2: One Image, Many Objects
   ------------------------------------------------------------------ */
const oneGroup = new THREE.Group();
scene.add(oneGroup);
oneGroup.visible = false;

const eyePos = new THREE.Vector3(0, 1.35, 6);
const objectA = { height: 1.0, z: -4, color: 0x60a5fa, x: -1.6 };
const objectB = { height: 1.5, z: -6, color: 0xfacc15, x: 1.6 };

// Build a simple humanoid figure so the demo looks like people, not boxes.
function makeFigure(height, color, x, z) {
  const group = new THREE.Group();
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.5 })
  );
  head.position.y = height - 0.12;
  head.castShadow = true;
  group.add(head);

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.22, height * 0.55, 16),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 })
  );
  body.position.y = height * 0.45;
  body.castShadow = true;
  group.add(body);

  const legGeo = new THREE.CylinderGeometry(0.07, 0.07, height * 0.32, 12);
  const pants = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 });
  const leftLeg = new THREE.Mesh(legGeo, pants);
  leftLeg.position.set(-0.09, height * 0.19, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, pants);
  rightLeg.position.set(0.09, height * 0.19, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);

  const armGeo = new THREE.CylinderGeometry(0.055, 0.055, height * 0.35, 12);
  const leftArm = new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 }));
  leftArm.position.set(-0.25, height * 0.52, 0);
  leftArm.rotation.z = 0.1;
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 }));
  rightArm.position.set(0.25, height * 0.52, 0);
  rightArm.rotation.z = -0.1;
  group.add(rightArm);

  group.position.set(x, 0, z);
  group.castShadow = true;
  return group;
}

let figureA = makeFigure(objectA.height, objectA.color, objectA.x, objectA.z);
let figureB = makeFigure(objectB.height, objectB.color, objectB.x, objectB.z);
oneGroup.add(figureA, figureB);

// Environment: ground plane, distant backdrop, and a simple grid.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x1a2332, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
oneGroup.add(ground);
const grid = new THREE.GridHelper(60, 60, 0x334155, 0x1e293b);
grid.position.y = 0.01;
oneGroup.add(grid);

const projGroup = new THREE.Group();
oneGroup.add(projGroup);

function disposeFigure(group) {
  group.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

function updateOneImage() {
  const distB = parseFloat(document.getElementById('dist-slider').value);
  const sizeB = parseFloat(document.getElementById('size-slider').value);
  objectB.height = sizeB;
  objectB.z = -distB;

  oneGroup.remove(figureB);
  disposeFigure(figureB);
  figureB = makeFigure(objectB.height, objectB.color, objectB.x, objectB.z);
  oneGroup.add(figureB);

  const dA = eyePos.z - objectA.z, dB = eyePos.z - objectB.z;
  const angA = 2 * Math.atan(objectA.height / (2 * dA)) * 180 / Math.PI;
  const angB = 2 * Math.atan(objectB.height / (2 * dB)) * 180 / Math.PI;
  const match = Math.abs(angA - angB) < 0.5;

  projGroup.clear();
  const lineColor = match ? 0x4ade80 : 0xf87171;
  [figureA, figureB].forEach((fig) => {
    const top = fig.position.clone().setY(fig.position.y + fig.children[0].position.y + 0.12);
    const bot = fig.position.clone().setY(0);
    projGroup.add(makeLine(eyePos, top, lineColor));
    projGroup.add(makeLine(eyePos, bot, lineColor));
  });

  // Retina diagram: an eye icon + a projection screen between eye and figures.
  const screenZ = 3.4, screenY = 1.35;
  const frameW = 1.6, frameH = 0.9;
  const corner = (dx, dy) => new THREE.Vector3(dx, screenY + dy, screenZ);
  const hw = frameW / 2, hh = frameH / 2;
  projGroup.add(makeLine(corner(-hw, -hh), corner(hw, -hh), 0xe94560));
  projGroup.add(makeLine(corner(hw, -hh), corner(hw, hh), 0xe94560));
  projGroup.add(makeLine(corner(hw, hh), corner(-hw, hh), 0xe94560));
  projGroup.add(makeLine(corner(-hw, hh), corner(-hw, -hh), 0xe94560));

  const screenLabel = makeTextSprite('retinal image (screen)', '#e94560');
  screenLabel.position.set(0, screenY + hh + 0.35, screenZ);
  screenLabel.scale.set(1.8, 0.45, 1);
  projGroup.add(screenLabel);

  // Draw the two silhouettes on the retina screen, side by side.
  [ [figureA, -0.36], [figureB, 0.36] ].forEach(([fig, offX]) => {
    const h = fig.children[0].position.y + 0.12 + fig.position.y; // total height
    const k = (eyePos.z - screenZ) / (eyePos.z - fig.position.z);
    const screenH = h * k;
    const mat = new THREE.MeshBasicMaterial({ color: fig.children[1].material.color, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.28, screenH), mat);
    mesh.position.set(offX, screenY, screenZ);
    projGroup.add(mesh);
  });

  // Simple eye icon at the observer point.
  const eyeBall = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 20, 20),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
  );
  eyeBall.position.copy(eyePos);
  projGroup.add(eyeBall);
  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x111111 })
  );
  pupil.position.set(eyePos.x, eyePos.y, eyePos.z - 0.11);
  projGroup.add(pupil);
  const eyeLabel = makeTextSprite('eye', '#ffffff');
  eyeLabel.position.copy(eyePos).add(new THREE.Vector3(0, 0.35, 0));
  eyeLabel.scale.set(0.9, 0.25, 1);
  projGroup.add(eyeLabel);

  document.getElementById('badge1').innerHTML = `Figure A: height <b>${objectA.height.toFixed(1)} m</b>, distance <b>${dA.toFixed(1)} m</b> → angular size <b>${angA.toFixed(1)}°</b>`;
  document.getElementById('badge2').innerHTML = `Figure B: height <b>${sizeB.toFixed(2)} m</b>, distance <b>${distB.toFixed(1)} m</b> → angular size <b>${angB.toFixed(1)}°</b>`;
  document.getElementById('badge3').innerHTML = match
    ? `<b>Same retinal image</b> — the eye cannot tell them apart`
    : `Different retinal images — you can tell them apart`;
}

/* ------------------------------------------------------------------
   UI state
   ------------------------------------------------------------------ */
let currentScene = 'oneimage';
let viewMode = 'peephole';
let showTrue = false;

const btnAmes = document.getElementById('btn-ames');
const btnOne = document.getElementById('btn-oneimage');
const btnPeep = document.getElementById('btn-peephole');
const btnOrbit = document.getElementById('btn-orbit');
const btnTrue = document.getElementById('btn-true');
const btnReset = document.getElementById('btn-reset');
const posSlider = document.getElementById('pos-slider');
const distSlider = document.getElementById('dist-slider');
const sizeSlider = document.getElementById('size-slider');

function setCameraForCurrent() {
  if (viewMode === 'peephole') {
    detachControls(); // camera is locked: no pan, no zoom, no rotate
    if (currentScene === 'ames') {
      camera.position.copy(EYE);
      camera.lookAt(EYE.x, EYE.y, EYE.z - 10);
    } else {
      camera.position.copy(eyePos);
      camera.lookAt(eyePos.x, eyePos.y, eyePos.z - 10);
    }
  } else {
    if (currentScene === 'ames') {
      camera.position.set(8.5, 5, 10.5);
      attachControls(new THREE.Vector3(-1, 0.7, -4));
    } else {
      camera.position.set(7, 4.5, 9);
      attachControls(new THREE.Vector3(0, 0.6, -3));
    }
  }
}

function updateUI() {
  btnAmes.classList.toggle('active', currentScene === 'ames');
  btnOne.classList.toggle('active', currentScene === 'oneimage');
  btnPeep.classList.toggle('active', viewMode === 'peephole');
  btnOrbit.classList.toggle('active', viewMode === 'orbit');
  btnTrue.classList.toggle('active', showTrue);
  btnTrue.textContent = showTrue ? 'Hide true shape' : 'Show true shape';
  document.getElementById('ames-controls').style.display = currentScene === 'ames' ? 'block' : 'none';
  document.getElementById('oneimage-controls').style.display = currentScene === 'oneimage' ? 'block' : 'none';

  const orbitAmes = currentScene === 'ames' && viewMode === 'orbit';
  trueShapeGroup.visible = orbitAmes && showTrue;
  peepholeMarker.visible = orbitAmes;
  matCeil.opacity = orbitAmes ? 0.15 : 1; // fade ceiling to reveal the trapezoid plan
  amesGroup.visible = currentScene === 'ames';
  oneGroup.visible = currentScene === 'oneimage';

  document.getElementById('note-text').innerHTML = currentScene === 'ames'
    ? 'Through the peephole this looks like an ordinary rectangular room — yet the figure shrinks and grows. ' +
      '<b>Free orbit</b> + <b>Show true shape</b> reveals the trapezoid. (Orbit rotates only; no pan or zoom.)'
    : 'Adjust size and distance until both objects cast the same retinal projection. ' +
      'Same image, different real objects — one image could be a thousand objects.';

  setCameraForCurrent();
  if (currentScene === 'ames') updateCharacter(parseInt(posSlider.value) / 100);
  else updateOneImage();
}

btnAmes.onclick = () => { currentScene = 'ames'; updateUI(); };
btnOne.onclick = () => { currentScene = 'oneimage'; updateUI(); };
btnPeep.onclick = () => { viewMode = 'peephole'; updateUI(); };
btnOrbit.onclick = () => { viewMode = 'orbit'; updateUI(); };
btnTrue.onclick = () => { showTrue = !showTrue; updateUI(); };
btnReset.onclick = () => {
  posSlider.value = 0;
  distSlider.value = 6;
  sizeSlider.value = 1.5;
  document.getElementById('dist-val').textContent = '6.0 m';
  document.getElementById('size-val').textContent = '1.50 m';
  document.getElementById('pos-val').textContent = 'Left';
  viewMode = 'peephole';
  showTrue = false;
  updateUI();
};

posSlider.oninput = () => {
  const v = parseInt(posSlider.value);
  document.getElementById('pos-val').textContent = v < 20 ? 'Left (far)' : v > 80 ? 'Right (near)' : 'Middle';
  updateCharacter(v / 100);
};
distSlider.oninput = () => {
  document.getElementById('dist-val').textContent = parseFloat(distSlider.value).toFixed(1) + ' m';
  updateOneImage();
};
sizeSlider.oninput = () => {
  document.getElementById('size-val').textContent = parseFloat(sizeSlider.value).toFixed(2) + ' m';
  updateOneImage();
};

/* ------------------------------------------------------------------
   Render loop
   ------------------------------------------------------------------ */
function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateUI();
animate();
</script>
</body>
</html>
